openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8081
  description: Generated server url
paths:
  /api/v1/auth/register:
    post:
      tags:
      - access-controller
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDto"
  /api/v1/auth/refresh:
    post:
      tags:
      - access-controller
      operationId: refresh
      parameters:
      - name: refreshToken
        in: cookie
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponseDto"
  /api/v1/auth/logout:
    post:
      tags:
      - access-controller
      operationId: logout
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /api/v1/auth/login:
    post:
      tags:
      - access-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponseDto"
  /api/v1/security/change-password:
    patch:
      tags:
      - security-controller
      operationId: changePassword
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeDto"
        required: true
      responses:
        "200":
          description: OK
  /api/v1/token/validate:
    get:
      tags:
      - token-controller
      operationId: validate
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenValidationDto"
  /api/v1/auth/tokens:
    delete:
      tags:
      - token-controller
      operationId: revokeAll
      parameters:
      - name: refreshToken
        in: cookie
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /api/v1/auth/token:
    delete:
      tags:
      - token-controller
      operationId: revoke
      parameters:
      - name: refreshToken
        in: cookie
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
components:
  schemas:
    RegisterDto:
      required:
      - email
      - password
      - username
      type: object
      properties:
        username:
          maxLength: 2147483647
          minLength: 4
          type: string
        email:
          type: string
        password:
          maxLength: 2147483647
          minLength: 6
          type: string
    UserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
          - USER
          - ADMIN
        enabled:
          type: boolean
    TokenResponseDto:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        accessToken:
          type: string
        jti:
          type: string
        expiration:
          type: string
          format: date-time
    LoginDto:
      required:
      - password
      - username
      type: object
      properties:
        username:
          maxLength: 2147483647
          minLength: 4
          type: string
        password:
          maxLength: 2147483647
          minLength: 6
          type: string
    PasswordChangeDto:
      required:
      - newPassword
      - oldPassword
      type: object
      properties:
        oldPassword:
          maxLength: 2147483647
          minLength: 6
          type: string
        newPassword:
          maxLength: 2147483647
          minLength: 6
          type: string
    TokenValidationDto:
      type: object
      properties:
        valid:
          type: boolean
        id:
          type: string
          format: uuid
        jti:
          type: string
        username:
          type: string
        role:
          type: string
          enum:
          - USER
          - ADMIN
        email:
          type: string
